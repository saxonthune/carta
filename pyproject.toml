[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhidoc"
version = "0.7.0"
description = "CLI for managing .rhidoc/ specification workspaces"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "saxonthune" }]
requires-python = ">=3.10"
dependencies = [
    "click",
    "pyyaml",
    "markdown-it-py",
]

[project.urls]
Repository = "https://github.com/saxonthune/rhidoc"

[project.optional-dependencies]
test = ["pytest", "hypothesis", "pytest-cov", "syrupy", "pyrefly"]

[project.scripts]
rhidoc = "rhidoc.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rhidoc --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["rhidoc"]

[tool.hatch.build]
artifacts = ["rhidoc/**/*.md"]

[tool.pyrefly]
project-includes = ["rhidoc/**/*.py"]
