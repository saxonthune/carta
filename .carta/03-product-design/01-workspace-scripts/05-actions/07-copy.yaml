# Action-catalog row for `carta copy`.

id: copy
summary: Copy an external file into the workspace at a numbered position
cli: "carta copy <source> [<destination>] [--at REF | --before REF] [--rename SLUG] [--dry-run]"

inputs:
  source:
    type: path
    required: true
    description: File outside the workspace
  destination:
    type: path
    required: false
    description: Workspace directory to copy into (append mode; omit when using --at/--before)
  at:
    type: ref
    default: null
    description: Exact target ref; copies iff the slot is free (strict / non-displacing)
  before:
    type: ref
    default: null
    description: Insert at ref, bumping siblings at or above target prefix up by one (displacing)
  rename:
    type: str
    default: null
  dry_run:
    type: bool
    default: false

guards:
  - id: G-COPY-1
    statement: source exists
    check: "exists(source)"
    error: ERR-COPY-SOURCE-NOT-FOUND
  - id: G-COPY-2
    statement: destination directory exists (append mode) or ref parent exists (--at/--before)
    check: "isdir(destination) OR (at/before ref parent is an existing dir)"
    error: ERR-COPY-DEST-NOT-FOUND
  - id: G-COPY-3
    statement: slug (derived or renamed) is filename-safe with no numeric prefix
    check: 'slug matches ^[a-z0-9][a-z0-9-]*$ AND not matches ^\d{2}-'
    error: ERR-COPY-BAD-SLUG
  - id: G-COPY-4
    statement: --at and --before are mutually exclusive; neither coexists with a positional destination
    check: "at IS NULL OR before IS NULL; (at OR before) AND destination IS NULL"
    error: ERR-COPY-BAD-FLAGS
  - id: G-COPY-5
    statement: computed NN does not collide with an existing sibling (--at and append only; --before shifts)
    check: "target NN slot free OR --before displaces"
    error: ERR-COPY-COLLISION

effects:
  - id: E-COPY-1
    description: compute NN from ref or append position
  - id: E-COPY-2
    description: (--before only) bump siblings at or above NN up by one and rewrite refs
  - id: E-COPY-3
    description: copy source bytes to destination/NN-<slug>.<ext>
  - id: E-COPY-4
    description: regenerate MANIFEST.md (unless dry_run)

invariants_preserved:
  - INV-1
  - INV-2
  - INV-3
  - INV-4
  - INV-5
  - INV-6

error_modes:
  - ERR-COPY-SOURCE-NOT-FOUND
  - ERR-COPY-DEST-NOT-FOUND
  - ERR-COPY-BAD-SLUG
  - ERR-COPY-BAD-FLAGS
  - ERR-COPY-COLLISION

properties:
  - id: PROP-COPY-FILE-EXISTS
    statement: after copy, NN-slug.<ext> exists at destination with identical bytes to source
    test: test_copy_file_exists
  - id: PROP-COPY-NO-RENUMBER
    statement: siblings not at/above target have unchanged prefixes (append and --at modes)
    test: test_copy_no_renumber
  - id: PROP-COPY-BEFORE-DISPLACES
    statement: --before bumps siblings at or above target prefix; no prefix collision after copy
    test: test_copy_before_displaces
